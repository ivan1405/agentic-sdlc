# .asdlc/policy.yaml — the per-engagement dial.
#
# This file is the whole point of the standard: the gates are identical across
# clients, the thresholds are not. A regulated bank and a startup MVP run the
# same `asdlc verify`; they disagree only here.
#
# Presets live in gates/presets/. Start from one, then tune.

profile: balanced   # strict | balanced | light  (documentation only; see presets/)

# Which SDD methodology `asdlc init --sdd` installed here (none/openspec/
# speckit/bmad/kiro). Recorded so a later `asdlc init` re-run — e.g. adding a
# tool — knows what's already configured without repeating --sdd, and so
# `asdlc doctor`/the printed next-step hint stay accurate. Edit by hand if
# you switch front-ends outside of `asdlc init --force`.
sdd: %%SDD_CHOICE%%

# Where asdlc's own artifact contract lives. Set once by `asdlc init` based on
# --sdd: openspec/changes+specs when OpenSpec is the front-end (or none is),
# .asdlc/changes+specs otherwise — avoids calling this directory "openspec"
# when OpenSpec isn't actually installed. Edit by hand if you move it later;
# every gate reads these two values, not a hardcoded path.
artifact_dirs:
  changes: %%CHANGES_DIR%%
  specs: %%SPECS_DIR%%

# What counts as production code. Everything else is free to change without spec.
source_globs:
  - "src/**"
  - "lib/**"
  - "app/**"
  - "internal/**"
  - "cmd/**"

# Capability map: the drift gate's spine.
# capability-name: [globs that implement it]
# The change's spec.md must declare `Capability: <name>` when these files move.
capabilities:
  # billing:
  #   - "src/billing/**"
  #   - "src/api/invoices/**"
  # auth:
  #   - "src/auth/**"

# These checks verify asdlc's OWN artifact contract — proposal/spec/design/
# tasks.md, REQ-IDs, SHALL statements — nothing about OpenSpec, Spec Kit,
# BMAD, or Kiro specifically. They're on by default (`sdd: none` above)
# because nothing else checks that contract. `asdlc init --sdd <front-end>`
# disables the four spec-shape ones below, since that front-end's own
# commands don't produce this shape. Still using asdlc's own /propose
# alongside the front-end? Flip them back to `enabled: true` by hand.
checks:
  spec-present:
    enabled: true
    required_artifacts: [proposal.md, spec.md, design.md, tasks.md]
    # Escape hatches. Keep this list short and boring, or it eats the standard.
    exempt_globs:
      - "**/*.md"
      - "**/*.lock"
      - "**/migrations/__init__.py"

  spec-lint:
    enabled: true
    min_scenarios_per_requirement: 1

  traceability:
    enabled: true
    require_test_reference: true
    test_globs:
      - "tests/**"
      - "test/**"
      - "**/*_test.py"
      - "**/*_test.go"
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.spec.ts"
      - "**/*Test.java"

  spec-drift:
    enabled: true
    mode: fail        # fail | warn  (start at warn on a legacy repo, ratchet to fail)

  coverage-delta:
    enabled: true
    report: coverage.xml
    min_changed_file_coverage: 80
    missing_report: fail   # fail | skip

  security-scan:
    enabled: true
    secrets_sweep: true
    # Use whatever the client already owns. Empty list = secrets sweep only.
    scanners:
      # - "semgrep --config auto --error --quiet ."
      # - "trivy fs --exit-code 1 --severity HIGH,CRITICAL ."
      # - "gitleaks detect --no-banner --redact"
      # - "npm audit --audit-level=high"

  human-approval:
    enabled: true
    min_pr_reviews: 1
    approver_domains:        # e.g. ["yourconsultancy.com", "client.com"]
    sensitive:
      architecture:
        - "**/design.md"
        - "docs/adr/**"
      data-migration:
        - "**/migrations/**"
        - "**/*.sql"
      authn-authz:
        - "src/auth/**"
        - "**/permissions*"
      public-api:
        - "**/openapi*.y*ml"
        - "**/*.proto"
      money:
        - "src/billing/**"
        - "src/payments/**"
      infra:
        - "**/*.tf"
        - "**/Dockerfile"
        - ".github/workflows/**"
