[project]
name = "asdlc"
version = "0.2.0"
description = "Tool-agnostic gates and artifact contract for an agentic SDLC"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ivan Perez" }]
keywords = ["agentic", "sdlc", "spec-driven-development", "code-review", "gates", "ci", "llm", "ai-agents"]
# License is declared via the trove classifier below rather than a PEP 639
# `license = "Apache-2.0"` SPDX string: the SPDX form needs setuptools>=77,
# but build-system pins only >=64, and mixing the SPDX string with a
# classifier is a hard error on 77+. Classifier-only works on both. The
# LICENSE file is auto-included in the wheel by setuptools' default glob.
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []          # deliberate: these gates run in whatever CI the client already has

[project.urls]
Homepage = "https://github.com/ivan1405/agentic-sdlc"
Repository = "https://github.com/ivan1405/agentic-sdlc"
Issues = "https://github.com/ivan1405/agentic-sdlc/issues"

[project.scripts]
asdlc = "asdlc.cli:main"

[build-system]
requires = ["setuptools>=64"]   # needs >=62.3 for ** globs in package-data
build-backend = "setuptools.build_meta"

# src-layout: nothing is importable unless it was installed, so a missing file
# fails in the test suite instead of in a client's terminal. This whole file is
# the thing that broke in 0.1.0 — the assets were not in the wheel and the source
# tree was silently covering for it.
[tool.setuptools.packages.find]
where = ["src"]
include = ["asdlc*"]

# The payload. asdlc init reads/renders these into the client repo at runtime, so if it
# is not listed here it does not exist. tests/test_packaging.sh proves it.
[tool.setuptools.package-data]
asdlc = [
    "gates/policy.yaml",
    "gates/presets/*.yaml",
    "assets/mcp_catalog.json",
    "assets/templates/*.tpl",
    "assets/templates/kiro/*.tpl",
    "assets/templates/*.md",
    "assets/templates/change/*.md",
    "assets/skills/**/SKILL.md",
    "assets/commands/*.md",
    "assets/agents/*.md",
    "assets/practices/*.md",
    "assets/ci/**/*.yml",
]
